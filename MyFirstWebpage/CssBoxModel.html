<!DOCTYPE html>
<html>

<head>
    <title>
        CSS Box Model
    </title>

    <style>
        body{
            padding: 0;
            margin: 0;
        }
        .Box1 {
            background-color: aqua;
            height: 80px;
            width: 100px;
            padding: 20px;
            border: 10px solid blue;
            margin: 20px;
            padding-left: 10px;
            padding-right: 100px;
            padding-top: 20px;
            padding-bottom: 30px;
        }
        

        .Box2 {

            background-color: beige;
        }
    </style>

</head>

<Body>
    <div class="Box1">First </div>
    <div class="Box2"> Second</div>
    <div> Third</div>

</Body>



</html>
